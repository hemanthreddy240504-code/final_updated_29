services:
  - type: web
    name: etidhi-pipeline-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etidhi-pipeline-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: etidhi-pipeline-db
    plan: free
